
name: Build AudioArts 4100 VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure project
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: AudioArts4100-Windows-VST3
          path: build/AudioArts4100_artefacts/Release/VST3/AudioArts 4100.vst3
